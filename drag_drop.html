<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop Cards</title>
  
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
</head>
<body class="p-8 bg-gray-100">

  <h2 class="text-2xl font-semibold mb-4">Drag a card from one container to another</h2>

  <!-- Source Container (where the draggable cards are placed initially) -->
  <div class="mb-6">
    <h3 class="text-xl font-medium mb-2">Source Container</h3>
    <div id="source" class="flex space-x-4 overflow-x-auto p-4 border-2 border-dashed border-gray-300 rounded-lg">
      <!-- Draggable card -->
      <div id="card1" class="w-60 h-32 bg-white rounded-lg shadow-lg cursor-pointer transform transition-transform hover:scale-105 p-4"
           draggable="true" ondragstart="drag(event)">
        <div class="flex flex-col justify-center items-center space-y-2">
          <img src="https://via.placeholder.com/100" alt="Card Image" class="w-24 h-24 rounded-full object-cover">
          <span class="text-lg font-semibold text-gray-800">Card 1</span>
        </div>
      </div>
      <div id="card2" class="w-60 h-32 bg-white rounded-lg shadow-lg cursor-pointer transform transition-transform hover:scale-105 p-4"
           draggable="true" ondragstart="drag(event)">
        <div class="flex flex-col justify-center items-center space-y-2">
          <img src="https://via.placeholder.com/100" alt="Card Image" class="w-24 h-24 rounded-full object-cover">
          <span class="text-lg font-semibold text-gray-800">Card 2</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Target Container (where the card can be dropped) -->
  <div class="mb-6">
    <h3 class="text-xl font-medium mb-2">Target Container</h3>
    <div id="target" class="w-full h-64 border-2 border-dashed border-gray-400 p-4 bg-white rounded-lg shadow-lg flex items-center justify-center"
         ondrop="drop(event)" ondragover="allowDrop(event)">
      <p class="text-center text-gray-600">Drop cards here</p>
    </div>
  </div>
  <script>
    // Allow the drop event
    function allowDrop(ev) {
      ev.preventDefault();
    }

    // Start the drag event
    function drag(ev) {
      ev.dataTransfer.setData("text", ev.target.id);  // Store the id of the dragged element
    }

    // Handle the drop event
    function drop(ev) {
      ev.preventDefault();
      var data = ev.dataTransfer.getData("text");
      ev.target.appendChild(document.getElementById(data));  // Append the dragged element
    }
  </script>
</body>
</html>
